
<!DOCTYPE html>
<html>
<head>
<title>Absolute Positioning</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    text-align: center;
}

h1 {
    color: blue;
}

.container {
    position: relative;
    width: 500px;
    height: 350px;
    background: lightgray;
    margin: 40px auto;
    border: 2px solid black;
}

.box1 {
    position: absolute;
    top: 20px;
    left: 20px;
    background: red;
    color: white;
    padding: 20px;
}

.box2 {
    position: absolute;
    top: 20px;
    right: 20px;
    background: green;
    color: white;
    padding: 20px;
}

.box3 {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: blue;
    color: white;
    padding: 20px;
}

.box4 {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: purple;
    color: white;
    padding: 20px;
}
</style>
</head>

<body>

<h1>CSS Absolute Positioning</h1>

<p>Example of absolute positioning in HTML.</p>

<div class="container">

    <div class="box1">Top Left</div>

    <div class="box2">Top Right</div>

    <div class="box3">Bottom Left</div>

    <div class="box4">Bottom Right</div>

</div>

</body>
</html>
